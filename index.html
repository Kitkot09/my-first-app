<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOHAINIE STUDY TIMER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg-card: rgba(17, 24, 39, 0.75);
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            padding: 24px;
            overflow: hidden;
            position: relative;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
                url("bg.jpg") center/cover no-repeat;
            background-attachment: fixed;
        }

        .live-clock {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(17, 24, 39, 0.8);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .timer-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .timer-header {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 8px;
            font-weight: 700;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .timer-display-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 32px auto;
            display: grid;
            place-items: center;
        }

        .timer-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.08);
        }

        .timer-time {
            font-size: 48px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }

        .timer-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 16px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #start-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3);
        }

        #start-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        #pause-btn, #reset-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #pause-btn:hover, #reset-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .status-message {
            font-size: 13px;
            color: var(--text-muted);
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="live-clock" id="live-clock">--:--:--</div>

    <div class="timer-card">
        <div class="timer-header">Focused Flow</div>
        <h1>JOHAINIE STUDY TIMER</h1>
        <p class="subtitle">Stay deep in your work, one focused sprint at a time.</p>

        <div class="timer-display-container">
            <div class="timer-ring"></div>
            <div>
                <div class="timer-time" id="time">25:00</div>
                <div class="timer-label" id="timer-label">Study Session</div>
            </div>
        </div>

        <div class="controls">
            <button id="start-btn">Start</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>

        <div class="status-message" id="status">Ready to focus.</div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        let isRunning = false;

        const timeDisplay = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusMsg = document.getElementById('status');
        const liveClockDisplay = document.getElementById('live-clock');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function updateLiveClock() {
            const now = new Date();
            const philippineTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
            let hours = philippineTime.getHours();
            const minutes = philippineTime.getMinutes().toString().padStart(2, '0');
            const seconds = philippineTime.getSeconds().toString().padStart(2, '0');
            const meridiem = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            liveClockDisplay.textContent = `${hours}:${minutes}:${seconds} ${meridiem}`;
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            statusMsg.textContent = "Focus session in progress...";
            
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    isRunning = false;
                    statusMsg.textContent = "Time's up! Great job!";
                    alert("Study session complete!");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            isRunning = false;
            statusMsg.textContent = "Timer paused.";
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            timeLeft = 25 * 60;
            updateDisplay();
            statusMsg.textContent = "Ready to focus.";
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
        updateLiveClock();
        setInterval(updateLiveClock, 1000);
    </script>
</body>
</html>
